name: Quote Automation

on:
  schedule:
    - cron: "0 * * * *" # every hour, UTC
  workflow_dispatch: 

jobs:
  quote-automation-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Write Google service account key
        run: |
          mkdir -p app/credentials
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_KEY_JSON" > app/credentials/service_account_key.json
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_JSON }}

      - name: Run quote automation
        run: python app/main.py
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_FILE: credentials/service_account_key.json
          GOOGLE_PARTS_SHEET_ID: ${{ secrets.GOOGLE_PARTS_SHEET_ID }}
          GOOGLE_PARTS_SHEET_NAME: ${{ secrets.GOOGLE_PARTS_SHEET_NAME }}
          GOOGLE_CONTACTS_SHEET_ID: ${{ secrets.GOOGLE_CONTACTS_SHEET_ID }}
          GOOGLE_CONTACTS_SHEET_NAME: ${{ secrets.GOOGLE_CONTACTS_SHEET_NAME }}
          GOOGLE_CONFIG_SHEET_ID: ${{ secrets.GOOGLE_CONFIG_SHEET_ID }}
          GOOGLE_CONFIG_SHEET_NAME: ${{ secrets.GOOGLE_CONFIG_SHEET_NAME }}
          GOOGLE_INTAKE_PARTS_SHEET_ID: ${{ secrets.GOOGLE_INTAKE_PARTS_SHEET_ID }}
          GOOGLE_INTAKE_PARTS_SHEET_NAME: ${{ secrets.GOOGLE_INTAKE_PARTS_SHEET_NAME }}
          GOOGLE_INTAKE_CONTACTS_SHEET_ID: ${{ secrets.GOOGLE_INTAKE_CONTACTS_SHEET_ID }}
          GOOGLE_INTAKE_CONTACTS_SHEET_NAME: ${{ secrets.GOOGLE_INTAKE_CONTACTS_SHEET_NAME }}
          BROKER_BIN_REPORT_MINS: ${{ secrets.BROKER_BIN_REPORT_MINS }}
          BROKER_BIN_REPORT_SUBJECT: ${{ secrets.BROKER_BIN_REPORT_SUBJECT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

